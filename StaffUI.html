// Audio Synthesizer via Web Audio API
class CyberAudio {
  constructor() {
    this.ctx = null;
    this.enabled = true;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
  }
  playClick() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(780, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.07);
    } catch (e) {}
  }
  playSelect() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.13);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.14);
    } catch (e) {}
  }
  playSuccess() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.08);
        gain.gain.setValueAtTime(0.1, now + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + i * 0.08);
        osc.stop(now + i * 0.08 + 0.28);
      });
    } catch (e) {}
  }
}

  const [customerName, setCustomerName] = useState('');
  const [customerPhone, setCustomerPhone] = useState('');
  const [customerNote, setCustomerNote] = useState('');
  const [lineUid, setLineUid] = useState('');
  const [lineName, setLineName] = useState('');
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [bookingSuccessData, setBookingSuccessData] = useState(null);
  const [slipFile, setSlipFile] = useState(null);
  const [slipPreview, setSlipPreview] = useState(null);
  const [isUploadingSlip, setIsUploadingSlip] = useState(false);
  const [slipUploadSuccess, setSlipUploadSuccess] = useState(false);
  const [copiedBank, setCopiedBank] = useState(false);
  const [quickBankModalOpen, setQuickBankModalOpen] = useState(false);
  const [quickSearchInput, setQuickSearchInput] = useState('');
  const [bankConfig, setBankConfig] = useState({
    bankName: "ธนาคารกสิกรไทย (KBANK)",
    accountNo: "004-1234567890",
    accountName: "ร้านเสือซุ่ม แม่กลอง",
    qrCodeUrl: ""
  });
  const slipInputRef = useRef(null);

  useEffect(() => {
    soundFx.enabled = soundEnabled;
  }, [soundEnabled]);

  // Load Bookings from Google Apps Script Backend
  const fetchBankConfig = async () => {
    try {
      const res = await fetch(`${SCRIPT_URL}?action=getBankConfig`);
      const d = await res.json();
      if (d.success && d.config) {
        setBankConfig(prev => ({
          ...prev,
          bankName: d.config.bankName || prev.bankName,
          accountNo: d.config.accountNo || prev.accountNo,
          accountName: d.config.accountName || prev.accountName,
          qrCodeUrl: d.config.qrCodeUrl || prev.qrCodeUrl
        }));
      }
    } catch(e) {}
  };

  const fetchLiveBookings = async () => {
    try {
      const res = await fetch(`${SCRIPT_URL}?action=getBookings`);
      const data = await res.json();
      if (Array.isArray(data)) {
        const map = {};
        data.forEach(r => {
          if (r.tableId) map[r.tableId] = r;
        });
        setBookings(map);
      }
    } catch (e) {
      console.warn("ไม่สามารถดึงข้อมูลหลังบ้านได้:", e.message);
    }
  };

  useEffect(() => {
    fetchLiveBookings();
    fetchBankConfig();
    // โหลดข้อมูลโต๊ะอัปเดตแบบเรียลไทม์ทุก 10 วินาที
    const timer = setInterval(fetchLiveBookings, 10000);

    // เชื่อมต่อ LINE LIFF SDK
    try {
      if (window.liff && LIFF_ID) {
        window.liff.init({ liffId: LIFF_ID }).then(() => {
          if (window.liff.isLoggedIn()) {
            window.liff.getProfile().then(p => {
              if (p.displayName) {
                setCustomerName(p.displayName);
                setLineName(p.displayName);
              }
              if (p.userId) setLineUid(p.userId);
            }).catch(err => console.log("LIFF getProfile error:", err));
          }
        }).catch(err => console.log("LIFF init error:", err));
      }
    } catch (e) {}

    return () => clearInterval(timer);
  }, []);

  const triggerToast = (msg, type = 'info') => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3500);
  };

  // Click Handler for Table
  const handleTableClick = (num) => {
    const b = bookings[num];
    const isBooked = b && (b.status === 'paid' || b.status === 'booked' || b.status === 'verified');
    const isPage = b && (b.status === 'pending_external' || b.isExternal || b.customerName?.includes('เพจร้าน') || b.channel === 'เพจร้าน');
    const isPending = b && (b.status === 'pending' || b.status === 'slip_uploaded') && !isPage;
    
    if (isBooked || isPage || isPending) {
      soundFx.playClick();
      const statusText = isBooked ? 'ถูกจองและชำระเงินแล้ว' : (isPage ? 'จองแล้ว (รอชำระเงินจากระบบอื่น / เพจร้าน)' : 'กำลังรอดำเนินการชำระเงินในระบบ');
      triggerToast(`โต๊ะ #${num} ${statusText} (${isPage ? 'จองจากเพจร้าน' : (b.customerName || 'ไม่ว่าง')})`, 'warn');
      return;
    }

    soundFx.playSelect();
    setSelectedTable(num);
    setModalOpen(true);
  };

  const handleTableHover = (num, event) => {
    const rect = event.currentTarget.getBoundingClientRect();
    setTooltipPos({
      x: rect.left + rect.width / 2,
      y: rect.top - 10
    });
    setHoveredTable(num);
  };

  const handleTableLeave = () => {
    setHoveredTable(null);
  };

  // Copy Bank Account
  const handleCopyBank = () => {
    navigator.clipboard.writeText(bankConfig.accountNo || "004-1234567890").then(() => {
      setCopiedBank(true);
      soundFx.playClick();
      triggerToast("คัดลอกเลขบัญชี 004-1234567890 สำเร็จ", "success");
      setTimeout(() => setCopiedBank(false), 3000);
    }).catch(() => {
      triggerToast("เลขบัญชีธนาคาร: 004-1234567890", "info");
    });
  };

  // Handle Slip Selection with Magic Byte & Image Verification
  const handleSlipChange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    if (!file.type.startsWith('image/')) {
      triggerToast("กรุณาเลือกไฟล์รูปภาพสลิปโอนเงิน (JPG, PNG)", "error");
      return;
    }
    if (file.size < 10 * 1024) {
      triggerToast("⚠️ ไฟล์รูปภาพมีขนาดเล็กผิดปกติ (ต่ำกว่า 10KB) กรุณาตรวจสอบสลิป", "error");
      return;
    }
    if (file.size > 8 * 1024 * 1024) {
      triggerToast("⚠️ ไฟล์ภาพมีขนาดใหญ่เกิน 8MB กรุณาเลือกไฟล์ขนาดเล็กลง", "error");
      return;
    }

    // Step 1: Magic Byte Validation (ตรวจโครงสร้างไฟล์จริง ป้องกันการปลอมแปลงไฟล์)
    const byteReader = new FileReader();
    byteReader.onload = (bEv) => {
      const bytes = new Uint8Array(bEv.target.result);
      let isValidMagic = false;

      // JPEG (FF D8 FF)
      if (bytes[0] === 0xFF && bytes[1] === 0xD8 && bytes[2] === 0xFF) {
        isValidMagic = true;
      }
      // PNG (89 50 4E 47)
      else if (bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4E && bytes[3] === 0x47) {
        isValidMagic = true;
      }
      // WebP (52 49 46 46)
      else if (bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46) {
        isValidMagic = true;
      }

      if (!isValidMagic) {
        triggerToast("⚠️ ไฟล์ไม่ใช่รูปภาพที่ถูกต้อง (ตรวจพบความผิดปกติของโครงสร้างไฟล์)", "error");
        if (slipInputRef.current) slipInputRef.current.value = "";
        return;
      }

      // Step 2: Read as Data URL & Verify Image Dimensions
      const reader = new FileReader();
      reader.onload = (ev) => {
        const dataUrl = ev.target.result;
        const img = new Image();
        img.onload = () => {
          if (img.width < 250 || img.height < 250) {
            triggerToast("⚠️ ความละเอียดของสลิปต่ำเกินไป กรุณาใช้รูปถ่ายสลิปที่คมชัด", "warn");
          }
          setSlipFile(file);
          setSlipPreview(dataUrl);
          soundFx.playSelect();
          triggerToast("📄 โหลดสลิปสำเร็จ พร้อมส่งตรวจสอบ", "success");
        };
        img.onerror = () => {
          triggerToast("❌ ไม่สามารถแสดงผลรูปภาพได้ กรุณาลองใหม่อีกครั้ง", "error");
        };
        img.src = dataUrl;
      };
      reader.readAsDataURL(file);
    };
    byteReader.readAsArrayBuffer(file.slice(0, 8));
  };

  // Handle Slip Upload Submission to Backend GAS
  const handleUploadSlipSubmit = async () => {
    if (!slipFile || !bookingSuccessData) return;
    setIsUploadingSlip(true);
    soundFx.playClick();
    try {
      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64Data = e.target.result;
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'uploadSlip',
            bookingId: bookingSuccessData.bookingId,
            slipBase64: base64Data,
            mimeType: slipFile.type || 'image/jpeg'
          })
        });
        const data = await res.json();
        setIsUploadingSlip(false);
        if (data.success) {
          soundFx.playSuccess();
          setSlipUploadSuccess(true);
          triggerToast("✅ ส่งสลิปสำเร็จ! ระบบได้ส่งแจ้งเตือนไปที่ LINE สตาฟแล้ว", "success");
          fetchLiveBookings();
        } else {
          triggerToast(data.error || "เกิดข้อผิดพลาดในการส่งสลิป", "error");
        }
      };
      reader.onerror = () => {
        setIsUploadingSlip(false);
        triggerToast("ไม่สามารถประมวลผลรูปภาพได้ กรุณาลองใหม่", "error");
      };
      reader.readAsDataURL(slipFile);
    } catch (err) {
      setIsUploadingSlip(false);
      console.error("Upload slip error:", err);
      triggerToast("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์", "error");
    }
  };

  // Confirm Reservation & Lock Table on Google Sheets
  const handleConfirmReservation = async (e) => {
    e.preventDefault();
    if (!selectedTable) return;
    if (!customerName.trim() || !customerPhone.trim()) {
      triggerToast("กรุณากรอกชื่อและเบอร์โทรศัพท์สำหรับติดต่อ", "error");
      return;
    }

    setIsSubmitting(true);
    soundFx.playClick();

    try {
      // ส่งคำสั่งจองไปที่ Google Apps Script
      const payload = {
        action: 'book',
        tableNo: selectedTable,
        table: selectedTable,
        name: customerName.trim(),
        phone: customerPhone.trim(),
        note: customerNote.trim(),
        lineUid: lineUid || "",
        lineName: lineName || customerName.trim(),
        amount: UNIFIED_TABLE_PRICE
      };

      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      // กรณีโต๊ะถูกจองซ้ำ หรือมีคนจองตัดหน้า
      if (!data.success) {
        soundFx.playClick();
        triggerToast(data.error || `ขออภัย โต๊ะ #${selectedTable} มีผู้จองไปแล้ว กรุณาเลือกโต๊ะอื่น`, "error");
        await fetchLiveBookings();
        return;
      }

      // จองสำเร็จ — บันทึกสถานะล็อคโต๊ะทันที
      const officialBooking = {
        bookingId: data.bookingId || `VIP-${String(selectedTable).padStart(3, '0')}`,
        ticketNo: `VIP-${String(selectedTable).padStart(3, '0')}`,
        cards: [
          `VIP-${String(selectedTable).padStart(3, '0')}/1`,
          `VIP-${String(selectedTable).padStart(3, '0')}/2`,
          `VIP-${String(selectedTable).padStart(3, '0')}/3`,
          `VIP-${String(selectedTable).padStart(3, '0')}/4`
        ],
        tableId: selectedTable,
        customerName: customerName.trim(),
        phone: customerPhone.trim(),
        note: customerNote.trim(),
        amount: data.amount || UNIFIED_TABLE_PRICE,
        status: 'pending',
        time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
        expireAt: data.expireAt ? new Date(data.expireAt).getTime() : Date.now() + 15 * 60 * 1000
      };

      setBookings(prev => ({
        ...prev,
        [selectedTable]: officialBooking
      }));

      soundFx.playSuccess();
      setBookingSuccessData(officialBooking);
      triggerToast(`จองโต๊ะ #${selectedTable} สำเร็จ! โต๊ะถูกล็อคแล้ว (รหัส: ${data.bookingId})`, 'success');

      // อัปเดตผังสด
      fetchLiveBookings();

    } catch (err) {
      console.error('Booking sync error:', err);
      triggerToast("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์ กรุณาลองใหม่อีกครั้ง", "error");
    } finally {
      setIsSubmitting(false);
    }
  };

  // Stats calculation
  const stats = useMemo(() => {
    let booked = 0;
    let pending = 0;
    let pagePending = 0;
    Object.values(bookings).forEach(b => {
      const isPaid = (b.status === 'paid' || b.status === 'booked' || b.status === 'verified');
      const isPage = (b.status === 'pending_external' || b.isExternal || b.customerName?.includes('เพจร้าน') || b.channel === 'เพจร้าน');
      const isPend = (b.status === 'pending' || b.status === 'slip_uploaded') && !isPage;
      if (isPaid) booked++;
      else if (isPage) pagePending++;
      else if (isPend) pending++;
    });
    return {
      booked,
      pending,
      pagePending,
      available: Math.max(0, 100 - (booked + pending + pagePending)),
      total: 100
    };
  }, [bookings]);

  // Filter Matcher
  const isTableVisible = (num) => {
    const b = bookings[num];
    const isAvail = !b || (!['paid', 'booked', 'verified', 'pending', 'pending_external', 'slip_uploaded'].includes(b.status));

    if (filterTab === 'AVAILABLE' && !isAvail) return false;
    if (filterTab === 'STAGE' && !(num >= 32 && num <= 62)) return false;
    if (filterTab === 'STAR' && !(num >= 91 && num <= 96)) return false;

    if (searchQuery.trim()) {
      return String(num).includes(searchQuery.trim());
    }
    return true;
  };

  return (
    <div className="min-h-screen flex flex-col text-slate-100">
      
      {/* ── 1. ส่วนหัวและแถบเมนูนำทาง (HEADER) ── */}
      <header className="sticky top-0 z-40 glass-panel border-b border-cyan-500/20 px-4 lg:px-8 py-3 shadow-glass">
        <div className="max-w-[1720px] mx-auto flex flex-col lg:flex-row items-center justify-between gap-4">
          
          {/* โลโก้แบรนด์และชื่อร้าน */}
          <div className="flex items-center gap-4 w-full lg:w-auto justify-between lg:justify-start">
            <div className="flex items-center gap-3">
              <div className="relative flex-shrink-0">
                <img
                  src="https://s.imgz.io/2026/09/06/logo2bbfef167092421a.jpg"
                  alt="ร้านเสือซุ่ม แม่กลอง"
                  className="w-12 h-12 rounded-full object-cover border-2 border-amber-400 shadow-[0_0_15px_rgba(251,191,36,0.4)] ring-2 ring-amber-500/20"
                />
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-lg font-black tracking-wider bg-gradient-to-r from-white via-cyan-200 to-cyan-400 bg-clip-text text-transparent font-sans whitespace-nowrap">
                    เสือซุ่ม แม่กลอง
                  </span>
                  <span className="text-[10px] px-2.5 py-0.5 rounded-full font-extrabold uppercase tracking-widest bg-fuchsia-950/90 border border-fuchsia-400/50 text-fuchsia-300 shadow-[0_0_10px_rgba(255,0,127,0.3)] font-mono whitespace-nowrap">
                    ฿2,000 ทุกโต๊ะ
                  </span>
                </div>
                <div className="text-[11px] text-slate-400 font-medium tracking-wide flex items-center gap-1.5 whitespace-nowrap">
                  <span>วงพ่อจริตแม่ • แสดงสดและร้านอาหาร</span>
                  <span className="inline-block w-1 h-1 rounded-full bg-cyan-400"></span>
                  <span className="text-cyan-400 font-mono font-bold">ผังจำลองทางการ 100 โต๊ะ</span>
                </div>
              </div>
            </div>

            {/* ปุ่มเปิดข้อมูลบัญชีธนาคาร & แนบสลิปด่วน */}
            <button
              onClick={() => {
                soundFx.playSelect();
                setQuickBankModalOpen(true);
              }}
              className="px-3 py-1.5 rounded-xl bg-gradient-to-r from-emerald-500/20 to-cyan-500/20 hover:from-emerald-500/30 hover:to-cyan-500/30 border border-emerald-400/40 text-emerald-300 text-xs font-bold flex items-center gap-1.5 shadow-[0_0_15px_rgba(16,185,129,0.25)] transition-all transform hover:-translate-y-0.5 active:translate-y-0 whitespace-nowrap flex-shrink-0"
              title="ตรวจสอบเลขที่บัญชีธนาคาร QR Code หรือแนบสลิปโอนเงิน"
            >
              <Icons.CreditCard className="w-3.5 h-3.5 text-emerald-400" />
              <span className="hidden sm:inline">บัญชีธนาคาร & แนบสลิป</span>
              <span className="sm:hidden">แนบสลิป</span>
            </button>

            {/* ไฟสถานะระบบออนไลน์ */}
            <div className="flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900/80 border border-emerald-500/30 whitespace-nowrap">
              <span className="relative flex h-2 w-2">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
              </span>
              <span className="text-[11px] font-bold text-emerald-400 tracking-wider">
                ระบบออนไลน์พร้อมใช้งาน
              </span>
            </div>
          </div>

          {/* แถบตัวกรองและค้นหาโต๊ะ */}
          <div className="flex flex-wrap items-center gap-2.5 w-full lg:w-auto justify-center">
            <div className="flex items-center bg-slate-900/90 p-1 rounded-xl border border-cyan-500/20">
              {[
                { id: 'ALL', label: 'ทั้งหมด (100 โต๊ะ)' },
                { id: 'AVAILABLE', label: 'เฉพาะโต๊ะว่าง' },
                { id: 'STAGE', label: 'โซนหน้าเวที (32-62)' },
                { id: 'STAR', label: 'โซนดาว VIP (91-96)' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => {
                    soundFx.playClick();
                    setFilterTab(tab.id);
                  }}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${
                    filterTab === tab.id
                      ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-black shadow-neon-cyan'
                      : 'text-slate-300 hover:text-white hover:bg-slate-800/60'
                  }`}
                >
                  <span>{tab.label}</span>
                </button>
              ))}
            </div>

            {/* ช่องค้นหาโต๊ะด่วน */}
            <div className="relative">
              <input
                type="text"
                placeholder="ค้นหาโต๊ะ เช่น 42..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-36 lg:w-44 bg-slate-900/80 border border-slate-700/60 focus:border-cyan-400 rounded-xl px-3 py-1.5 pl-8 text-xs text-cyan-200 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-cyan-400 font-mono"
              />
              <Icons.Search className="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5 pointer-events-none" />
              {searchQuery && (
                <button
                  onClick={() => setSearchQuery('')}
                  className="absolute right-2.5 top-2 text-slate-400 hover:text-white"
                >
                  <Icons.X className="w-3.5 h-3.5" />
                </button>
              )}
            </div>

            {/* ปุ่มเปิด/ปิดเสียงเอฟเฟกต์ */}
            <button
              onClick={() => setSoundEnabled(!soundEnabled)}
              title={soundEnabled ? "ปิดเสียงเอฟเฟกต์" : "เปิดเสียงเอฟเฟกต์"}
              className="p-2 rounded-xl bg-slate-900/80 border border-slate-700/60 text-cyan-400 hover:border-cyan-400 transition-all"
            >
              {soundEnabled ? <Icons.Volume2 className="w-4 h-4" /> : <Icons.VolumeX className="w-4 h-4 text-slate-500" />}
            </button>
          </div>

        </div>
      </header>

      {/* ── ส่วนหลัก: แผนผังโต๊ะ + แถบควบคุมข้อมูล ── */}
      <main className="flex-1 max-w-[1720px] w-full mx-auto p-3 lg:p-6 flex flex-col lg:flex-row gap-6 items-start">
        
        {/* ── 2. พื้นที่แผนผังผังโต๊ะจริง (ภาพพื้นหลัง + จุดมาร์คตำแหน่งโต๊ะ) ── */}
        <div className="flex-1 w-full glass-panel rounded-2xl p-4 lg:p-6 shadow-glass relative overflow-hidden border border-cyan-500/25">
          
          {/* หัวข้อผังโต๊ะและสถิติโต๊ะ */}
          <div className="flex flex-wrap items-center justify-between gap-3 mb-4 relative z-10 border-b border-cyan-500/15 pb-3">
            <div className="flex items-center gap-3">

                    if (tNum && tNum >= 1 && tNum <= 100) {
                      setQuickBankModalOpen(false);
                      handleTableClick(tNum);
                    } else {
                      triggerToast("กรุณาระบุหมายเลขโต๊ะที่ถูกต้อง (1-100)", "warn");
                    }
                  }}
                  className="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-black"
                >
                  ค้นหา & แนบสลิป
                </button>
              </div>
              <div className="text-[10px] text-slate-400 mt-1.5">
                💡 หรือคลิกเลือกโต๊ะบนแผนผังผังโต๊ะได้โดยตรง
              </div>
            </div>

            <button
              onClick={() => setQuickBankModalOpen(false)}
              className="w-full mt-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs"
            >
              ปิดหน้าต่าง
            </button>
          </div>
        </div>
      )}
</main>

      {/* ── หน้าต่างป๊อบอัพสำหรับจองโต๊ะ (MODAL) ── */}
      {modalOpen && selectedTable && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
          <div
            className="w-full max-w-lg glass-panel-glow rounded-3xl p-6 lg:p-8 border-cyan-500/40 shadow-2xl relative"
            onClick={(e) => e.stopPropagation()}
          >
            {/* ปุ่มปิดหน้าต่าง */}
            <button
              onClick={() => {
                soundFx.playClick();
                setModalOpen(false);
                setBookingSuccessData(null);
              }}
              className="absolute top-5 right-5 w-8 h-8 rounded-full bg-slate-800/80 hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition-all"
            >
              <Icons.X className="w-4 h-4" />
            </button>

            {bookingSuccessData ? (
              /* หน้าจอแจ้งเตือนการจองสำเร็จ พร้อมช่องทางชำระเงินและแนบสลิป */
              <div className="text-center py-2 max-h-[82vh] overflow-y-auto pr-1">
                <div className="w-14 h-14 mx-auto rounded-2xl bg-emerald-500/20 border border-emerald-400/40 flex items-center justify-center text-emerald-400 mb-3 shadow-[0_0_25px_rgba(16,185,129,0.35)]">
                  <Icons.CheckCircle2 className="w-7 h-7" />
                </div>
                
                <h3 className="text-xl font-black text-white">
                  {slipUploadSuccess ? 'แนบสลิปเรียบร้อยแล้ว!' : 'จองโต๊ะสำเร็จ! รอการแนบสลิป'}
                </h3>
                <p className="text-xs text-slate-400 mt-0.5">
                  {slipUploadSuccess 
                    ? 'ระบบได้ส่งสลิปแจ้งเตือนไปยัง LINE สตาฟแล้ว เพื่อทำการตรวจสอบและยืนยันโต๊ะ' 
                    : 'โต๊ะถูกล็อคให้ท่าน 15 นาที กรุณาโอนเงินและแนบสลิปเพื่อยืนยันสิทธิ์'}
                </p>
                
                {/* ข้อมูลการจองสรุปย่อ */}
                <div className="my-3 p-3.5 rounded-2xl bg-slate-950/80 border border-cyan-500/30 text-left text-xs space-y-1.5">
                  <div className="flex justify-between py-0.5 border-b border-slate-800/80">
                    <span className="text-slate-400">รหัสการจอง:</span>
                    <b className="text-cyan-300 font-mono">{bookingSuccessData.bookingId}</b>
                  </div>
                  <div className="flex justify-between py-0.5 border-b border-slate-800/80">
                    <span className="text-slate-400">โต๊ะที่จอง:</span>
                    <b className="text-white font-bold">โต๊ะ #{bookingSuccessData.tableId} (VIP 4 ท่าน)</b>
                  </div>
                  <div className="flex justify-between py-0.5 border-b border-slate-800/80">
                    <span className="text-slate-400">ผู้จอง:</span>
                    <b className="text-white">{bookingSuccessData.customerName}</b>
                  </div>
                  <div className="flex justify-between py-0.5 border-b border-slate-800/80">
                    <span className="text-slate-400">ยอดชำระสุทธิ:</span>
                    <b className="text-emerald-400 text-sm font-mono font-black">฿{Number(bookingSuccessData.amount || UNIFIED_TABLE_PRICE).toLocaleString()} บาท</b>
                  </div>
                  <div className="flex justify-between py-0.5">
                    <span className="text-slate-400">สถานะ:</span>
                    <span className={slipUploadSuccess ? "text-emerald-400 font-bold" : "text-amber-400 font-bold"}>
                      {slipUploadSuccess ? "✅ ส่งสลิปแล้ว (รอสตาฟตรวจ)" : "⏳ รอชำระเงิน (ล็อค 15 นาที)"}
                    </span>
                  </div>
                </div>

                {/* กล่องรายละเอียดการโอนเงิน (ธนาคารกสิกรไทย) */}
                <div className="mb-4 p-4 rounded-2xl bg-gradient-to-br from-emerald-950/40 via-slate-900 to-cyan-950/40 border border-emerald-500/40 text-left shadow-lg">
                  <div className="flex items-center justify-between mb-2">
                    <div className="flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                      <span className="text-xs font-black text-white uppercase tracking-wider">บัญชีโอนเงินชำระค่าโต๊ะ</span>
                    </div>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                      KBANK กสิกรไทย
                    </span>
                  </div>

                  <div className="bg-slate-950/90 rounded-xl p-3 border border-emerald-500/20 mb-2">
                    <div className="text-[11px] text-slate-400 mb-0.5">เลขที่บัญชี (คลิกเพื่อคัดลอก):</div>
                    <div className="flex items-center justify-between">
                      <span className="text-lg lg:text-xl font-mono font-black text-emerald-300 tracking-wider">
                        004-1234567890
                      </span>
                      <button
                        type="button"
                        onClick={handleCopyBank}
                        className="px-3 py-1 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/40 text-xs font-bold flex items-center gap-1.5 transition-all"
                      >
                        {copiedBank ? <Icons.Check className="w-3.5 h-3.5 text-emerald-400" /> : <Icons.Copy className="w-3.5 h-3.5" />}
                        <span>{copiedBank ? "คัดลอกแล้ว" : "คัดลอก"}</span>
                      </button>
                    </div>
                  </div>

                  <div className="text-xs text-slate-300 flex justify-between pt-1 border-t border-slate-800">
                    <span>ชื่อบัญชี:</span>
                    <span className="font-bold text-white">ร้านเสือซุ่ม แม่กลอง</span>
                  </div>
                  <div className="text-xs text-slate-300 flex justify-between pt-1">
                    <span>ยอดที่ต้องโอน:</span>
                    <span className="font-black text-emerald-300 font-mono">฿2,000.00 บาท</span>
                  </div>
                </div>

                {/* กล่องแนบสลิปโอนเงิน */}
                {slipUploadSuccess ? (
                  <div className="mb-4 p-4 rounded-2xl bg-emerald-950/40 border border-emerald-500/40 text-center">
                    <div className="text-emerald-300 font-bold text-sm mb-1 flex items-center justify-center gap-1.5">
                      <Icons.CheckCircle2 className="w-5 h-5 text-emerald-400" />
                      <span>หลักฐานการชำระเงินถูกบันทึกแล้ว</span>
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed">
                      ระบบได้ส่งข้อความแจ้งเตือนพร้อมสลิปไปยัง LINE สตาฟแล้ว สตาฟกำลังดำเนินการตรวจและอนุมัติให้ท่าน
                    </p>
                  </div>
                ) : (
                  <div className="mb-4 p-4 rounded-2xl bg-slate-950/90 border border-cyan-500/30 text-left">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-xs font-bold text-white flex items-center gap-1.5">
                        <Icons.Upload className="w-4 h-4 text-cyan-400" />
                        แนบสลิปโอนเงินยืนยันการจอง *
                      </span>
                      <span className="text-[10px] text-cyan-300">แจ้งเตือน LINE สตาฟทันที</span>
                    </div>

                    <input
                      type="file"
                      ref={slipInputRef}
                      accept="image/*"
                      onChange={handleSlipChange}
                      className="hidden"
                    />

                    {slipPreview ? (
                      <div className="relative rounded-xl overflow-hidden border border-cyan-500/40 bg-slate-900/80 p-2 mb-3">
                        <img
                          src={slipPreview}
                          alt="Slip Preview"
                          className="w-full h-40 object-contain rounded-lg bg-black/50"
                        />
                        <button
                          type="button"
                          onClick={() => {
                            setSlipFile(null);
                            setSlipPreview(null);
                            if (slipInputRef.current) slipInputRef.current.value = '';
                          }}
                          className="absolute top-3 right-3 px-2 py-1 rounded bg-red-600/80 text-white text-[11px] font-bold shadow hover:bg-red-600"
                        >
                          เปลี่ยนรูป
                        </button>
                      </div>
                    ) : (
                      <div
                        onClick={() => slipInputRef.current && slipInputRef.current.click()}
                        className="cursor-pointer border-2 border-dashed border-cyan-500/40 hover:border-cyan-400 rounded-xl p-4 text-center bg-cyan-950/10 hover:bg-cyan-950/20 transition-all mb-3 group"
                      >
                        <Icons.FileImage className="w-8 h-8 mx-auto text-cyan-400 group-hover:scale-110 transition-transform mb-1.5" />
                        <div className="text-xs font-bold text-white">
                          แตะที่นี่เพื่อเลือกรูปภาพสลิปโอนเงิน
                        </div>
                        <div className="text-[10px] text-slate-400 mt-0.5">
                          รองรับรูปถ่ายจากกล้อง หรือไฟล์รูปจากอัลบั้ม (JPG, PNG)
                        </div>
                      </div>
                    )}

                    {/* ปุ่มยืนยันการแนบสลิป */}
                    <button
                      type="button"
                      onClick={handleUploadSlipSubmit}
                      disabled={!slipFile || isUploadingSlip}
                      className={`w-full py-3 px-4 rounded-xl font-black text-xs tracking-wider uppercase flex items-center justify-center gap-2 transition-all ${
                        slipFile && !isUploadingSlip
                          ? "bg-gradient-to-r from-cyan-400 via-blue-500 to-emerald-400 text-slate-950 shadow-neon-cyan hover:shadow-neon-magenta hover:-translate-y-0.5 active:translate-y-0"
                          : "bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700"
                      }`}
                    >
                      {isUploadingSlip ? (
                        <>
                          <span className="w-4 h-4 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></span>
                          <span>กำลังอัปโหลดและส่งแจ้งเตือน LINE สตาฟ...</span>
                        </>
                      ) : (
                        <>
                          <Icons.Upload className="w-4 h-4" />
                          <span>ยืนยันการแนบสลิปโอนเงิน</span>
                        </>
                      )}
                    </button>
                  </div>
                )}

                <button
                  onClick={() => {
                    soundFx.playClick();
                    setModalOpen(false);
                    setBookingSuccessData(null);
                    setSlipFile(null);
                    setSlipPreview(null);
                  }}
                  className="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs tracking-wider uppercase transition-all"
                >
                  {slipUploadSuccess ? "เสร็จสิ้น / ปิดหน้าต่าง" : "ไว้แนบสลิปภายหลัง (โต๊ะล็อค 15 นาที)"}
                </button>
              </div>
            ) : (
              /* ฟอร์มกรอกข้อมูลการจอง */
              <div>
                <div className="flex items-center gap-3 mb-4">
                  <div className="w-11 h-11 rounded-2xl bg-cyan-500/20 border border-cyan-400/50 flex items-center justify-center text-cyan-300 font-mono font-black text-lg shadow-neon-cyan">
                    #{selectedTable}
                  </div>
                  <div>
                    <h3 className="text-xl font-black text-white flex items-center gap-2">
                      ยืนยันการจองโต๊ะ #{selectedTable}
                      <span className="text-xs font-bold px-2 py-0.5 rounded bg-fuchsia-950 text-fuchsia-300 border border-fuchsia-500/40">
                        แพ็กเกจ VIP
                      </span>
                    </h3>
                    <p className="text-xs text-cyan-400">
                      ฿{UNIFIED_TABLE_PRICE.toLocaleString()} บาท • สำหรับ 4 ท่าน
                    </p>
                  </div>
                </div>

                <form onSubmit={handleConfirmReservation} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                      ชื่อ-นามสกุล ผู้จอง *
                    </label>
                    <div className="relative">
                      <input
                        type="text"
                        required
                        placeholder="ระบุชื่อ-นามสกุลของคุณ..."
                        value={customerName}
                        onChange={(e) => setCustomerName(e.target.value)}
                        className="w-full bg-slate-950/80 border border-slate-700/80 focus:border-cyan-400 rounded-xl px-4 py-2.5 pl-10 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-cyan-400"
                      />
                      <Icons.User className="w-4 h-4 text-slate-400 absolute left-3.5 top-3" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                      เบอร์โทรศัพท์ติดต่อ *
                    </label>
                    <div className="relative">
                      <input
                        type="tel"
                        required
                        placeholder="08x-xxx-xxxx"
                        value={customerPhone}
                        onChange={(e) => setCustomerPhone(e.target.value)}
                        className="w-full bg-slate-950/80 border border-slate-700/80 focus:border-cyan-400 rounded-xl px-4 py-2.5 pl-10 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-cyan-400 font-mono"
                      />
                      <Icons.Phone className="w-4 h-4 text-slate-400 absolute left-3.5 top-3" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                      คำขอพิเศษ / LINE ID (ถ้ามี)
                    </label>
                    <div className="relative">
                      <input
                        type="text"
                        placeholder="เช่น โต๊ะวันเกิด, ต้องการน้ำแข็งเพิ่ม, LINE ID..."
                        value={customerNote}
                        onChange={(e) => setCustomerNote(e.target.value)}
                        className="w-full bg-slate-950/80 border border-slate-700/80 focus:border-cyan-400 rounded-xl px-4 py-2.5 pl-10 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-cyan-400"
                      />
                      <Icons.MessageSquare className="w-4 h-4 text-slate-400 absolute left-3.5 top-3" />
                    </div>
                  </div>

                  {/* ข้อความแจ้งเตือนระยะเวลาล็อคโต๊ะ */}
                  <div className="p-3 rounded-xl bg-amber-950/20 border border-amber-500/30 flex items-start gap-2.5 text-xs text-amber-300/90">
                    <Icons.Clock className="w-4 h-4 text-amber-400 shrink-0 mt-0.5" />
                    <span>
                      ระบบจะทำการล็อคโต๊ะ (Hold) ชั่วคราว 15 นาที เพื่อให้ดำเนินการชำระเงิน หากพ้นกำหนดเวลา ระบบจะปล่อยโต๊ะให้ผู้อื่นสามารถจองได้ทันที
                    </span>
                  </div>

                  {/* ปุ่มส่งแบบฟอร์มการจอง */}
                  <button
                    type="submit"
                    disabled={isSubmitting}
                    className="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-400 via-blue-500 to-fuchsia-600 text-slate-950 font-black text-sm tracking-wider uppercase shadow-neon-cyan hover:shadow-neon-magenta transition-all flex items-center justify-center gap-2 mt-2"
                  >
                    {isSubmitting ? (
                      <span className="inline-block animate-spin w-4 h-4 border-2 border-slate-950 border-t-transparent rounded-full"></span>
                    ) : (
                      <>
                        <span>ยืนยันการจองโต๊ะ • ฿{UNIFIED_TABLE_PRICE.toLocaleString()} บาท</span>
                        <Icons.ArrowRight className="w-4 h-4" />
                      </>
                    )}
                  </button>
                </form>
              </div>
            )}
          </div>
        </div>
      )}

      {/* ── แถบแจ้งเตือนด้านล่าง (TOAST NOTIFICATIONS) ── */}
      {toast && (
        <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-full text-xs font-bold tracking-wider shadow-2xl flex items-center gap-2.5 transition-all ${
          toast.type === 'success' ? 'bg-emerald-400 text-slate-950 shadow-[0_0_20px_rgba(16,185,129,0.5)]' :
          toast.type === 'error' ? 'bg-rose-500 text-white shadow-[0_0_20px_rgba(244,63,94,0.5)]' :
          toast.type === 'warn' ? 'bg-amber-400 text-slate-950 shadow-[0_0_20px_rgba(245,158,11,0.5)]' :
          'bg-cyan-400 text-slate-950 shadow-neon-cyan'
        }`}>
          <Icons.Info className="w-4 h-4" />
          <span>{toast.msg}</span>
        </div>
      )}

    </div>
  );
}

// Mount to DOM
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
