<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Portal — VIP Booking System</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f18;
  --surface: #141722;
  --surface2: #1c2030;
  --border: rgba(100,150,255,0.15);
  --txt: #f0f4f8;
  --muted: #8b9bb4;
  --blue: #00d2ff;
  --blue-dim: rgba(0,210,255,0.1);
  --pink: #ff007f;
  --amber: #f5a623;
  --amber-dim: rgba(245,166,35,0.12);
  --jade: #00e676;
  --jade-dim: rgba(0,230,118,0.12);
  --purple: #a855f7;
  --purple-dim: rgba(168,85,247,0.12);
  --danger: #ff4757;
  --danger-dim: rgba(255,71,87,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans Thai','Outfit',sans-serif;min-height:100vh;}

/* ── TOP NAV ── */
.nav{
  display:flex;align-items:center;gap:16px;
  padding:14px 28px;
  background:rgba(0,0,0,0.5);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:100;
}
.nav-brand{font-family:'Outfit',sans-serif;font-weight:800;font-size:17px;color:#fff;}
.nav-brand span{color:var(--pink);}
.nav-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:rgba(255,0,127,0.15);color:var(--pink);border:1px solid rgba(255,0,127,0.3);letter-spacing:.05em;}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.user-pill{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:13px;}
.user-pill .avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;}
.btn-logout{background:transparent;border:1px solid rgba(255,71,87,0.3);color:var(--danger);padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all.2s;}
.btn-logout:hover{background:var(--danger-dim);}

/* ── MAIN WRAP ── */
.wrap{max-width:1400px;margin:0 auto;padding:24px 24px 60px;}

/* ── DASHBOARD STATS ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
.stat-card .num{font-family:'Outfit',sans-serif;font-weight:800;font-size:26px;line-height:1;margin-bottom:4px;}
.stat-card .lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.stat-card.blue .num{color:var(--blue);}
.stat-card.amber .num{color:var(--amber);}
.stat-card.jade .num{color:var(--jade);}
.stat-card.purple .num{color:var(--purple);}
.stat-card.pink .num{color:var(--pink);}
.stat-card.danger .num{color:var(--danger);}

.revenue-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px;}
.rev-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:14px;}
.rev-card .ico{font-size:24px;}
.rev-card .rv{font-family:'Outfit',sans-serif;font-weight:800;font-size:20px;}
.rev-card .rl{font-size:11px;color:var(--muted);font-weight:500;}

/* ── ACTION BAR ── */
.action-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.action-bar .search-inputs{display:flex;gap:8px;flex-wrap:wrap;flex:1;}
.search-input{background:var(--surface);border:1px solid var(--border);color:var(--txt);border-radius:8px;padding:9px 14px;font-size:13px;font-family:inherit;transition:all.2s;min-width:130px;}
.search-input:focus{outline:none;border-color:var(--blue);background:var(--blue-dim);}
.filter-select{background:var(--surface);border:1px solid var(--border);color:var(--txt);border-radius:8px;padding:9px 14px;font-size:13px;font-family:inherit;cursor:pointer;}
.filter-select option{background:var(--surface2);}

.btn-group{display:flex;gap:8px;}
.btn{border:none;border-radius:8px;padding:9px 16px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:all.2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn.primary{background:linear-gradient(135deg,#00d2ff,#3a7bd5);color:#fff;box-shadow:0 3px 12px rgba(0,210,255,0.25);}
.btn.primary:hover{transform:translateY(-1px);}
.btn.success{background:linear-gradient(135deg,#00e676,#00a152);color:#fff;}
.btn.warning{background:linear-gradient(135deg,#f5a623,#e67e22);color:#fff;}
.btn.danger{background:var(--danger-dim);color:var(--danger);border:1px solid rgba(255,71,87,0.3);}
.btn.danger:hover{background:rgba(255,71,87,0.2);}
.btn.ghost{background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
.btn.ghost:hover{border-color:rgba(255,255,255,0.3);color:#fff;}
.btn.export{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;}
.btn.backup{background:var(--surface2);border:1px solid var(--border);color:var(--jade);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;}

/* ── TABLE ── */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.3);}
.table-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.table-head h2{font-family:'Outfit',sans-serif;font-weight:700;font-size:15px;}
.table-count{font-size:12px;color:var(--muted);}

table{width:100%;border-collapse:collapse;}
thead tr{background:var(--surface2);}
th{padding:11px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;}
td{padding:11px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,0.02);}

.status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.04em;white-space:nowrap;}
.status-badge.available{background:rgba(255,255,255,0.06);color:#aaa;border:1px solid rgba(255,255,255,0.15);}
.status-badge.pending{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(245,166,35,0.4);}
.status-badge.slip_uploaded{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(0,210,255,0.4);}
.status-badge.verified{background:var(--purple-dim);color:var(--purple);border:1px solid rgba(168,85,247,0.4);}
.status-badge.paid{background:var(--jade-dim);color:var(--jade);border:1px solid rgba(0,230,118,0.4);}
.status-badge.cancelled{background:var(--danger-dim);color:var(--danger);border:1px solid rgba(255,71,87,0.4);}
.status-badge.expired{background:rgba(255,255,255,0.04);color:#666;border:1px solid rgba(255,255,255,0.08);}

.action-btns{display:flex;gap:6px;flex-wrap:wrap;}
.act-btn{border:none;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all.2s;white-space:nowrap;}
.act-btn.verify{background:rgba(0,210,255,0.12);color:var(--blue);border:1px solid rgba(0,210,255,0.3);}
.act-btn.paid{background:rgba(0,230,118,0.12);color:var(--jade);border:1px solid rgba(0,230,118,0.3);}
.act-btn.change{background:rgba(168,85,247,0.12);color:var(--purple);border:1px solid rgba(168,85,247,0.3);}
.act-btn.cancel{background:rgba(255,71,87,0.08);color:var(--danger);border:1px solid rgba(255,71,87,0.25);}
.act-btn.audit{background:rgba(255,255,255,0.05);color:var(--muted);border:1px solid rgba(255,255,255,0.1);}
.act-btn.slip-view{background:rgba(245,166,35,0.1);color:var(--amber);border:1px solid rgba(245,166,35,0.3);}
.act-btn:hover{opacity:.85;transform:translateY(-1px);}
.act-btn:disabled{opacity:.3;cursor:not-allowed;transform:none;}

/* ── OVERLAY / MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;opacity:0;visibility:hidden;transition:all.25s;}
.overlay.show{opacity:1;visibility:visible;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:480px;padding:28px;position:relative;transform:translateY(14px) scale(.96);transition:all.3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 20px 60px rgba(0,0,0,0.5);max-height:90vh;overflow-y:auto;}
.overlay.show .modal{transform:translateY(0) scale(1);}
.modal.wide{max-width:700px;}
.modal h3{font-family:'Outfit',sans-serif;font-size:22px;color:#fff;margin-bottom:4px;}
.modal .msub{color:var(--muted);font-size:13px;margin-bottom:20px;}
.close-x{position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.05);border:none;color:var(--muted);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all.2s;}
.close-x:hover{background:rgba(255,255,255,0.1);color:#fff;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500;}
.field input,.field select,.field textarea{width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);color:#fff;border-radius:8px;padding:10px 14px;font-size:14px;font-family:inherit;transition:all.2s;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);}
.field textarea{resize:vertical;min-height:80px;}
.field select option{background:var(--surface2);}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.info-item{background:rgba(0,0,0,0.2);border-radius:8px;padding:10px 14px;}
.info-item .il{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;margin-bottom:3px;}
.info-item .iv{font-size:13px;font-weight:600;}

/* Audit log table in modal */
.audit-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;}
.audit-table th{padding:7px 10px;background:rgba(0,0,0,0.3);color:var(--muted);font-weight:600;text-align:left;}
.audit-table td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,0.05);}

/* Table picker */
.table-picker{display:grid;grid-template-columns:repeat(8,44px);gap:6px;margin:12px 0;}
.tpick{width:44px;height:44px;border-radius:7px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.04);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:12px;font-weight:700;transition:all.15s;}
.tpick:hover{border-color:var(--blue);background:var(--blue-dim);}
.tpick.selected{border-color:var(--jade);background:var(--jade-dim);color:var(--jade);}
.tpick.occupied{opacity:.25;cursor:not-allowed;pointer-events:none;}

/* Slip preview */
.slip-img{width:100%;border-radius:8px;margin-top:10px;max-height:400px;object-fit:contain;}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(12px);background:#fff;color:#000;font-weight:700;padding:10px 22px;border-radius:28px;font-size:13px;z-index:300;opacity:0;pointer-events:none;transition:all.3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 8px 28px rgba(0,0,0,0.4);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{background:#ff4757;color:#fff;}
.toast.success{background:#00e676;color:#000;}

/* Loader */
.loader-bar{position:fixed;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,0.08);z-index:400;display:none;}
.loader-bar .prog{height:100%;width:35%;background:var(--blue);box-shadow:0 0 8px var(--blue);animation:ldg 1.4s infinite ease-in-out;}
@keyframes ldg{0%{transform:translateX(-120%)}100%{transform:translateX(380%)}}

/* Login Screen */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px;text-align:center;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
.login-card h1{font-family:'Outfit',sans-serif;font-size:28px;margin-bottom:6px;}
.login-card p{color:var(--muted);font-size:14px;margin-bottom:32px;}
.btn-google{background:#fff;color:#333;border:none;border-radius:10px;padding:14px 28px;font-size:15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:all.2s;}
.btn-google:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,255,255,0.15);}
.btn-google img{width:20px;}

/* Empty state */
.empty-state{padding:60px 20px;text-align:center;color:var(--muted);}
.empty-state .es-ico{font-size:48px;margin-bottom:12px;}

/* Responsive */
@media(max-width:900px){
  .stats-grid{grid-template-columns:repeat(3,1fr);}
  .revenue-row{grid-template-columns:1fr 1fr;}
  table{display:block;overflow-x:auto;}
}
@media(max-width:600px){
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .action-bar{flex-direction:column;align-items:stretch;}
  .action-bar .search-inputs{flex-direction:column;}
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div style="font-size:48px;margin-bottom:16px;">🎤</div>
    <h1>Staff Portal</h1>
    <p>วงพ่อจริตแม่ THE FATHER<br>LIVE SHOW & RESTAURANT</p>
    <button class="btn-google" onclick="signInWithGoogle()">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      เข้าสู่ระบบด้วย Google
    </button>
    <p id="loginError" style="color:var(--danger);font-size:12px;margin-top:16px;display:none;"></p>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none;">
  <nav class="nav">
    <div class="nav-brand">VIP <span>STAFF</span></div>
    <div class="nav-badge">STAFF PORTAL</div>
    <div class="nav-right">
      <div class="user-pill">
        <span id="userEmail" style="font-size:13px;"></span>
      </div>
      <button class="btn-logout" onclick="signOut()">ออกจากระบบ</button>
    </div>
  </nav>

  <div class="wrap">
    <!-- STATS -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="num" id="sTotalTables">100</div><div class="lbl">โต๊ะทั้งหมด</div></div>
      <div class="stat-card blue"><div class="num" id="sAvail">—</div><div class="lbl">ว่าง</div></div>
      <div class="stat-card amber"><div class="num" id="sPending">—</div><div class="lbl">รอชำระ</div></div>
      <div class="stat-card blue" style="--num-color:var(--blue)"><div class="num" id="sSlip" style="color:var(--blue)">—</div><div class="lbl">รอตรวจสลิป</div></div>
      <div class="stat-card purple"><div class="num" id="sVerified">—</div><div class="lbl">ยืนยันแล้ว</div></div>
      <div class="stat-card jade"><div class="num" id="sPaid">—</div><div class="lbl">ชำระแล้ว</div></div>
      <div class="stat-card danger"><div class="num" id="sCancelled">—</div><div class="lbl">ยกเลิก</div></div>
    </div>

    <div class="revenue-row">
      <div class="rev-card"><div class="ico">💰</div><div><div class="rv" id="rTotal">—</div><div class="rl">ยอดจองทั้งหมด</div></div></div>
      <div class="rev-card"><div class="ico">✅</div><div><div class="rv" id="rPaid" style="color:var(--jade)">—</div><div class="rl">ยอด Paid</div></div></div>
      <div class="rev-card"><div class="ico">⏳</div><div><div class="rv" id="rPending" style="color:var(--amber)">—</div><div class="rl">รอตรวจสอบ</div></div></div>
      <div class="rev-card"><div class="ico">❌</div><div><div class="rv" id="rCancelled" style="color:var(--danger)">—</div><div class="rl">ยกเลิก</div></div></div>
    </div>

    <!-- ACTION BAR -->
    <div class="action-bar">
      <div class="search-inputs">
        <input class="search-input" id="fBid"    placeholder="🔍 Booking No."  oninput="filterTable()">
        <input class="search-input" id="fName"   placeholder="👤 ชื่อลูกค้า"   oninput="filterTable()">
        <input class="search-input" id="fPhone"  placeholder="📱 เบอร์โทร"     oninput="filterTable()">
        <input class="search-input" id="fTable"  placeholder="🪑 หมายเลขโต๊ะ"  oninput="filterTable()">
        <select class="filter-select" id="fStatus" onchange="filterTable()">
          <option value="">— สถานะทั้งหมด —</option>
          <option value="pending">รอชำระ</option>
          <option value="slip_uploaded">รอตรวจสลิป</option>
          <option value="verified">ยืนยันแล้ว</option>
          <option value="paid">ชำระแล้ว</option>
          <option value="cancelled">ยกเลิก</option>
          <option value="expired">หมดอายุ</option>
        </select>
      </div>
      <div class="btn-group">
        <button class="btn primary" onclick="loadData()">🔄 รีเฟรช</button>
        <button class="btn export" onclick="exportCSV()">📤 Export CSV</button>
        <button class="btn backup" onclick="backupNow()">💾 Backup</button>
      </div>
    </div>

    <!-- BOOKINGS TABLE -->
    <div class="table-wrap">
      <div class="table-head">
        <h2>รายการจอง</h2>
        <div class="table-count" id="tableCount"></div>
      </div>
      <div id="tableContainer">
        <div class="empty-state"><div class="es-ico">⏳</div><div>กำลังโหลด...</div></div>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>
<div class="loader-bar" id="loaderBar"><div class="prog"></div></div>

<script>
// ── CONFIG ──────────────────────────────────────────────
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxrxaSAvVFreSCW5H-VJ-CruztGooiC81FsklIoPxF-aGx-gWjKqx_eYsuVA7Ycxo2o/exec";

// ── STATE ────────────────────────────────────────────────
let staffEmail = "";
let allBookings = [];
let currentBookings = []; // occupied tables cache for change-table picker

// ── HELPERS ──────────────────────────────────────────────
function showLoading(v){ document.getElementById('loaderBar').style.display=v?'block':'none'; }

function showToast(msg, type=''){
  const t=document.getElementById('toast');
  t.className='toast'+(type?' '+type:'');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3500);
}

function fmt(n){ return Number(n||0).toLocaleString('th-TH'); }
function fmtDate(s){
  if(!s) return '—';
  try{ return new Date(s).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}); }
  catch(e){ return s; }
}

function escHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ── AUTH ─────────────────────────────────────────────────
function signInWithGoogle(){
  // Google OAuth via redirect (Apps Script handles identity)
  const email = prompt("กรุณากรอก Email ของคุณ (ต้องอยู่ใน Staff Whitelist):");
  if(!email){ return; }
  staffEmail = email.trim().toLowerCase();
  localStorage.setItem('staffEmail', staffEmail);
  showApp();
}

function signOut(){
  staffEmail='';
  localStorage.removeItem('staffEmail');
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
}

function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('userEmail').textContent=staffEmail;
  loadData();
}

// ── LOAD DATA ─────────────────────────────────────────────
async function loadData(){
  showLoading(true);
  try{
    await Promise.all([loadDashboard(), loadBookings()]);
  }finally{ showLoading(false); }
}

async function loadDashboard(){
  try{
    const url=SCRIPT_URL+"?action=dashboard&staffEmail="+encodeURIComponent(staffEmail);
    const res=await fetch(url);
    const d=await res.json();
    if(!d.success){ showToast(d.error||'โหลด Dashboard ล้มเหลว','error'); return; }
    const s=d.stats;
    document.getElementById('sAvail').textContent=s.available;
    document.getElementById('sPending').textContent=s.pending;
    document.getElementById('sSlip').textContent=s.slip_uploaded;
    document.getElementById('sVerified').textContent=s.verified;
    document.getElementById('sPaid').textContent=s.paid;
    document.getElementById('sCancelled').textContent=s.cancelled;
    document.getElementById('rTotal').textContent='฿'+fmt(s.revenue_total);
    document.getElementById('rPaid').textContent='฿'+fmt(s.revenue_paid);
    document.getElementById('rPending').textContent='฿'+fmt(s.revenue_pending);
    document.getElementById('rCancelled').textContent='฿'+fmt(s.revenue_cancelled);
  }catch(e){ showToast('Dashboard error: '+e.message,'error'); }
}

async function loadBookings(){
  try{
    const url=SCRIPT_URL+"?action=staffBookings&staffEmail="+encodeURIComponent(staffEmail);
    const res=await fetch(url);
    const d=await res.json();
    if(!d.success){ showToast(d.error||'Unauthorized','error'); return; }
    allBookings=d.bookings||[];
    currentBookings=allBookings;
    filterTable();
  }catch(e){ showToast('โหลดรายการล้มเหลว: '+e.message,'error'); }
}

// ── FILTER / RENDER ───────────────────────────────────────
function filterTable(){
  const bid   = document.getElementById('fBid').value.trim().toLowerCase();
  const name  = document.getElementById('fName').value.trim().toLowerCase();
  const phone = document.getElementById('fPhone').value.trim();
  const table = document.getElementById('fTable').value.trim();
  const st    = document.getElementById('fStatus').value;

  const filtered=allBookings.filter(b=>{
    if(bid   && !String(b.booking_id||'').toLowerCase().includes(bid))   return false;
    if(name  && !String(b.name||'').toLowerCase().includes(name))         return false;
    if(phone && !String(b.phone||'').includes(phone))                     return false;
    if(table && !String(b.table_no||'').includes(table))                  return false;
    if(st    && b.status!==st)                                            return false;
    return true;
  });

  document.getElementById('tableCount').textContent=filtered.length+' รายการ';
  renderTable(filtered);
}

const STATUS_LABELS={
  available:'ว่าง',pending:'รอชำระ',slip_uploaded:'รอตรวจสลิป',
  verified:'ยืนยันแล้ว',paid:'ชำระแล้ว',cancelled:'ยกเลิก',expired:'หมดอายุ'
};

function renderTable(rows){
  const container=document.getElementById('tableContainer');
  if(!rows.length){
    container.innerHTML='<div class="empty-state"><div class="es-ico">🔍</div><div>ไม่พบรายการ</div></div>';
    return;
  }

  let html=`<table><thead><tr>
    <th>Booking ID</th><th>โต๊ะ</th><th>สถานะ</th><th>ชื่อ</th><th>เบอร์</th>
    <th>ยอด</th><th>เวลาจอง</th><th>สลิป</th><th>Actions</th>
  </tr></thead><tbody>`;

  rows.forEach(b=>{
    const st=b.status||'available';
    const canVerify=st==='slip_uploaded';
    const canPaid=['verified','slip_uploaded','pending'].includes(st);
    const canChange=!['paid','cancelled','expired'].includes(st);
    const canCancel=!['paid','cancelled'].includes(st);

    html+=`<tr>
      <td><span style="font-family:'Outfit',monospace;font-size:12px;color:var(--blue)">${escHtml(b.booking_id)}</span></td>
      <td><b style="font-size:16px">${escHtml(b.table_no)}</b></td>
      <td><span class="status-badge ${st}">${STATUS_LABELS[st]||st}</span></td>
      <td>${escHtml(b.name)}</td>
      <td>${escHtml(b.phone)}</td>
      <td style="color:var(--jade);font-weight:700">฿${fmt(b.amount)}</td>
      <td style="color:var(--muted);font-size:12px">${fmtDate(b.booked_at)}</td>
      <td>${b.slip_url?`<button class="act-btn slip-view" onclick="viewSlip('${escHtml(b.slip_url)}')">🖼️ ดู</button>`:'<span style="color:var(--muted);font-size:11px">—</span>'}</td>
      <td><div class="action-btns">
        ${canVerify?`<button class="act-btn verify" onclick="verifySlip('${escHtml(b.booking_id)}')">✅ ยืนยันสลิป</button>`:''}
        ${canPaid?`<button class="act-btn paid" onclick="markPaid('${escHtml(b.booking_id)}')">💰 Paid</button>`:''}
        ${canChange?`<button class="act-btn change" onclick="openChangeTable('${escHtml(b.booking_id)}','${escHtml(b.table_no)}')">🔄 เปลี่ยนโต๊ะ</button>`:''}
        ${canCancel?`<button class="act-btn cancel" onclick="openCancel('${escHtml(b.booking_id)}','${escHtml(b.table_no)}')">❌ ยกเลิก</button>`:''}
        <button class="act-btn audit" onclick="openAudit('${escHtml(b.booking_id)}')">📋 Log</button>
      </div></td>
    </tr>`;
  });

  html+='</tbody></table>';
  container.innerHTML=html;
}

// ── ACTIONS ───────────────────────────────────────────────

async function postAction(action, extra={}){
  showLoading(true);
  try{
    const res=await fetch(SCRIPT_URL,{
      method:'POST',
      body:JSON.stringify({action, staffEmail, ...extra})
    });
    return await res.json();
  }catch(e){ return {success:false,error:e.message}; }
  finally{ showLoading(false); }
}

async function verifySlip(bookingId){
  if(!confirm('ยืนยันสลิปการโอนเงิน Booking '+bookingId+'?')) return;
  const d=await postAction('verifySlip',{bookingId});
  showToast(d.success?'✅ ยืนยันสลิปแล้ว':'❌ '+d.error, d.success?'success':'error');
  if(d.success) loadData();
}

async function markPaid(bookingId){
  if(!confirm('ยืนยันชำระเงิน Booking '+bookingId+'?')) return;
  const d=await postAction('markPaid',{bookingId});
  showToast(d.success?'✅ Mark Paid เรียบร้อย':'❌ '+d.error, d.success?'success':'error');
  if(d.success) loadData();
}

// ── CANCEL MODAL ──────────────────────────────────────────
function openCancel(bookingId, tableNo){
  const overlay=document.createElement('div');
  overlay.className='overlay'; overlay.id='overlay';
  overlay.innerHTML=`
    <div class="modal">
      <button class="close-x" onclick="closeModal()">×</button>
      <h3>❌ ยกเลิกการจอง</h3>
      <div class="msub">Booking: ${escHtml(bookingId)} | โต๊ะ: ${escHtml(tableNo)}</div>
      <div class="field"><label>เหตุผลการยกเลิก *</label>
        <textarea id="cancelReason" placeholder="เช่น ลูกค้าโทรขอยกเลิก / ไม่ติดต่อกลับ"></textarea>
      </div>
      <button class="btn danger" style="width:100%;margin-top:4px" onclick="confirmCancel('${escHtml(bookingId)}')">ยืนยันการยกเลิก</button>
    </div>`;
  overlay.addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });
  document.body.appendChild(overlay);
  setTimeout(()=>overlay.classList.add('show'),10);
}

async function confirmCancel(bookingId){
  const reason=document.getElementById('cancelReason').value.trim();
  if(!reason){ showToast('กรุณาใส่เหตุผล','error'); return; }
  closeModal();
  const d=await postAction('cancel',{bookingId,reason});
  showToast(d.success?'✅ ยกเลิกเรียบร้อย':'❌ '+d.error, d.success?'success':'error');
  if(d.success) loadData();
}

// ── CHANGE TABLE MODAL ────────────────────────────────────
let selectedNewTable=null;
function openChangeTable(bookingId, currentTable){
  selectedNewTable=null;
  const occupiedTables=new Set(allBookings.filter(b=>
    !['cancelled','expired'].includes(b.status) && String(b.table_no)!==String(currentTable)
  ).map(b=>String(b.table_no)));

  let pickerHtml='<div class="table-picker">';
  for(let i=1;i<=100;i++){
    const isOcc=occupiedTables.has(String(i));
    const isCur=String(i)===String(currentTable);
    pickerHtml+=`<div class="tpick${isOcc||isCur?' occupied':''}" id="tp_${i}" onclick="selectNewTable(${i})">${i}</div>`;
  }
  pickerHtml+='</div>';

  const overlay=document.createElement('div');
  overlay.className='overlay'; overlay.id='overlay';
  overlay.innerHTML=`
    <div class="modal wide">
      <button class="close-x" onclick="closeModal()">×</button>
      <h3>🔄 เปลี่ยนโต๊ะ</h3>
      <div class="msub">Booking: ${escHtml(bookingId)} | โต๊ะปัจจุบัน: <b>${escHtml(currentTable)}</b></div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:8px">เลือกโต๊ะใหม่ (โต๊ะสีจาง = ถูกจองแล้ว)</p>
      ${pickerHtml}
      <div id="newTableInfo" style="font-size:13px;color:var(--muted);margin-top:8px;min-height:20px;"></div>
      <button class="btn primary" style="margin-top:16px;width:100%" onclick="confirmChangeTable('${escHtml(bookingId)}')">ยืนยันการย้ายโต๊ะ</button>
    </div>`;
  overlay.addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });
  document.body.appendChild(overlay);
  setTimeout(()=>overlay.classList.add('show'),10);
}

function selectNewTable(n){
  document.querySelectorAll('.tpick.selected').forEach(el=>el.classList.remove('selected'));
  const el=document.getElementById('tp_'+n);
  if(el){ el.classList.add('selected'); }
  selectedNewTable=n;
  const zone=n>=1&&n<=31?'B':'A';
  const price=n>=1&&n<=31?1600:2000;
  const info=document.getElementById('newTableInfo');
  if(info) info.innerHTML=`โต๊ะ <b>${n}</b> — Zone <b>${zone}</b> — ราคา <b>฿${price.toLocaleString()}</b>`;
}

async function confirmChangeTable(bookingId){
  if(!selectedNewTable){ showToast('กรุณาเลือกโต๊ะใหม่','error'); return; }
  closeModal();
  const d=await postAction('changeTable',{bookingId,newTableNo:selectedNewTable});
  if(d.success){
    showToast(`✅ ย้ายไปโต๊ะ ${d.newTable} เรียบร้อย (฿${fmt(d.newPrice)})`,'success');
    loadData();
  } else {
    showToast('❌ '+d.error,'error');
  }
}

// ── VIEW SLIP ─────────────────────────────────────────────
function viewSlip(url){
  const overlay=document.createElement('div');
  overlay.className='overlay'; overlay.id='overlay';
  overlay.innerHTML=`
    <div class="modal">
      <button class="close-x" onclick="closeModal()">×</button>
      <h3>🖼️ หลักฐานการชำระเงิน</h3>
      <img src="${escHtml(url)}" class="slip-img" onerror="this.alt='โหลดรูปไม่ได้'">
      <a href="${escHtml(url)}" target="_blank" class="btn ghost" style="margin-top:12px;display:flex;">🔗 เปิดใน Drive</a>
    </div>`;
  overlay.addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });
  document.body.appendChild(overlay);
  setTimeout(()=>overlay.classList.add('show'),10);
}

// ── AUDIT LOG MODAL ───────────────────────────────────────
async function openAudit(bookingId){
  showLoading(true);
  let logs=[];
  try{
    const res=await fetch(SCRIPT_URL+`?action=auditLog&staffEmail=${encodeURIComponent(staffEmail)}&bookingId=${encodeURIComponent(bookingId)}`);
    const d=await res.json();
    if(d.success) logs=d.logs;
  }catch(e){ showToast('โหลด Log ล้มเหลว','error'); }
  finally{ showLoading(false); }

  let rows=logs.length?logs.map(l=>`
    <tr>
      <td style="font-size:11px;color:var(--muted)">${fmtDate(l.timestamp)}</td>
      <td><b>${escHtml(l.action)}</b></td>
      <td style="color:var(--muted)">${escHtml(l.done_by)}</td>
      <td>${escHtml(l.before_status)} → ${escHtml(l.after_status)}</td>
      <td style="font-size:11px;color:var(--muted)">${escHtml(l.note)}</td>
    </tr>`).join(''):'<tr><td colspan="5" style="text-align:center;color:var(--muted)">ไม่มี Log</td></tr>';

  const overlay=document.createElement('div');
  overlay.className='overlay'; overlay.id='overlay';
  overlay.innerHTML=`
    <div class="modal wide">
      <button class="close-x" onclick="closeModal()">×</button>
      <h3>📋 Audit Log</h3>
      <div class="msub">Booking: ${escHtml(bookingId)}</div>
      <div style="overflow-x:auto">
      <table class="audit-table">
        <thead><tr><th>เวลา</th><th>Action</th><th>โดย</th><th>สถานะ</th><th>หมายเหตุ</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  overlay.addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });
  document.body.appendChild(overlay);
  setTimeout(()=>overlay.classList.add('show'),10);
}

// ── EXPORT CSV ────────────────────────────────────────────
async function exportCSV(){
  showLoading(true);
  try{
    const url=SCRIPT_URL+`?action=export&staffEmail=${encodeURIComponent(staffEmail)}`;
    const res=await fetch(url);
    const csv=await res.text();
    const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='vip_bookings_'+new Date().toISOString().slice(0,10)+'.csv';
    a.click();
    showToast('📤 Export CSV เรียบร้อย','success');
  }catch(e){ showToast('Export ล้มเหลว: '+e.message,'error'); }
  finally{ showLoading(false); }
}

// ── BACKUP ────────────────────────────────────────────────
async function backupNow(){
  if(!confirm('ยืนยันสำรองข้อมูล Bookings Sheet?')) return;
  const d=await postAction('backup',{});
  showToast(d.success?'💾 Backup: '+d.backupName:'❌ '+d.error, d.success?'success':'error');
}

// ── CLOSE MODAL ───────────────────────────────────────────
function closeModal(){
  const o=document.getElementById('overlay');
  if(o){ o.classList.remove('show'); setTimeout(()=>o.remove(),280); }
}

// ── INIT ──────────────────────────────────────────────────
window.onload = function(){
  const saved=localStorage.getItem('staffEmail');
  if(saved){
    staffEmail=saved;
    showApp();
  }
};
</script>
